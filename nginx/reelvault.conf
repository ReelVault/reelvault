# ReelVault web client + reverse proxy for the server container.
server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Match the server's max request body size (uploads, cover art).
	client_max_body_size 50m;

	# Serve the precompressed .gz files produced by the Website build.
	gzip_static on;

	location /v1/ {
		proxy_pass http://server:3030;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		# HLS playlists may block server-side while ffmpeg produces the first segments.
		proxy_read_timeout 3600s;
		proxy_buffering off;
	}

	location /api/ {
		proxy_pass http://server:3030;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}

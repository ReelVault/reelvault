# WebSocket upgrade semantics for proxied connections: an upgrade request
# keeps its Upgrade hop-by-hop header, everything else gets Connection: ""
# so the upstream keepalive pool can reuse the TCP connection.
map $http_upgrade $connection_upgrade {
	default upgrade;
	"" "";
}

# ReelVault web client + reverse proxy for the server container.
server {
	listen 80;
	listen 80 http2;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Match the server's max request body size (uploads, cover art).
	client_max_body_size 50m;

	# Kernel-side file transfer for the web UI assets: zero-copy sendfile with
	# optimal packetization. Static assets never touch the JS runtime.
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;

	# Reuse upstream connections instead of a TCP handshake per request.
	upstream reelvault_server {
		server server:3030;
		keepalive 32;
	}

	location /v1/ {
		proxy_pass http://reelvault_server;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		# HLS playlists may block server-side while ffmpeg produces the first segments.
		proxy_read_timeout 3600s;
		proxy_buffering off;
	}

	location /api/ {
		proxy_pass http://reelvault_server;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}

name: Publish SDK

# Publishes the `reelvault-sdk` package from sdk/ to npm on every v* tag.
# The version in sdk/package.json must match the tag (e.g. v1.0.0 -> 1.0.0).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish reelvault-sdk to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance (--provenance)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the SDK
        run: bun run build-sdk

      - name: Inspect the package contents
        working-directory: sdk
        run: npm pack --dry-run

      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Publish
        working-directory: sdk
        run: npm publish --access public --provenance

name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # The release workflow runs the same gate before it builds anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Biome, oxlint, TypeScript, knip, jscpd, the test-quality gate, the config guard and migration
          # drift; then the deterministic query audits (statements per operation, query plans).
          - name: Lint and query audits
            command: bun run lint && bun run benchmark query-count query-plan --strict
          # The whole suite once, with the coverage floor on top.
          - name: Tests
            command: bun run coverage
            ffmpeg: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The suite drives the real ffmpeg and ffprobe; the runner image ships neither.
      - name: Install FFmpeg
        if: matrix.ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  # Keeps the required-check name green only when every check passed, so branch
  # protection rules referencing it keep working.
  quality-gate:
    name: Code quality and tests
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all checks passed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = "success"

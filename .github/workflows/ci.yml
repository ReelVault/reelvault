name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # The release workflow runs this as a fallback when the commit has no CI result.
  workflow_call:

permissions:
  contents: read

env:
  # Pinned static FFmpeg release; bump deliberately. The suite is
  # build-independent, so a pinned version is safe.
  FFMPEG_VERSION: "n8.1.2-2"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Biome, oxlint, TypeScript, knip, jscpd, the test-quality gate, the config guard and
          # migration drift — the script runs every check side by side.
          - name: Lint
            command: bun run lint
          # The deterministic query audits (statements per operation, query plans), in their own
          # job so they do not extend the lint job's wall clock.
          - name: Query audits
            command: bun run benchmark query-count query-plan --strict
          # The whole suite once, with the coverage floor on top.
          - name: Tests
            command: bun run coverage
            ffmpeg: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The suite drives the real ffmpeg and ffprobe; the runner image ships neither. A pinned
      # static build restores from cache in seconds, where apt-get update plus install costs a
      # minute and can hang.
      - name: Cache FFmpeg
        if: matrix.ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/ffmpeg
          key: ${{ runner.os }}-${{ runner.arch }}-ffmpeg-${{ env.FFMPEG_VERSION }}

      - name: Install FFmpeg
        if: matrix.ffmpeg && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          FFMPEG_ARCH: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/ffmpeg/bin"
          for tool in ffmpeg ffprobe; do
            curl -fsSL "https://github.com/shaka-project/static-ffmpeg-binaries/releases/download/$FFMPEG_VERSION/$tool-linux-$FFMPEG_ARCH" \
              -o "$HOME/.local/ffmpeg/bin/$tool"
          done
          chmod +x "$HOME/.local/ffmpeg/bin/ffmpeg" "$HOME/.local/ffmpeg/bin/ffprobe"

      - name: Add FFmpeg to PATH
        if: matrix.ffmpeg
        run: echo "$HOME/.local/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  # Keeps the required-check name green only when every check passed, so branch
  # protection rules referencing it keep working.
  quality-gate:
    name: Code quality and tests
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all checks passed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = "success"

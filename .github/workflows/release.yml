name: Release server

# Builds and publishes the server release artifacts. Push a tag matching
# package.json (v1.2.3), or run manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (defaults to package.json)"
        required: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Release gate: a tag on a broken commit must not produce artifacts.
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The input, else the tag, else package.json — and whichever it is must match package.json.
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          package_version="$(jq -r .version package.json)"
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then version="$GITHUB_REF_NAME"; fi
          version="${version:-$package_version}"
          version="${version#v}"
          if [ "$version" != "$package_version" ]; then
            echo "::error::version $version does not match package.json version $package_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/release.sh "$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=( dist/release/* )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no release artifacts found in dist/release"
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ReelVault Server v$VERSION" \
              --generate-notes "${assets[@]}"
          fi
